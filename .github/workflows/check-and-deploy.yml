name: Evidence validation — check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      security_reviewed:
        description: Confirm existing Supabase migration, secrets, and ingress prerequisites are ready
        type: boolean
        required: true
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: evidence-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit and check source
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
      - name: Build application image once
        run: docker build -t "evidence-validation:$GITHUB_SHA" .
      - name: Smoke-test checked image
        run: |
          docker run --detach --name ev-smoke -p 127.0.0.1:8080:8080 -e APP_ORIGIN=https://example.test -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_ANON_KEY=ci-publishable-placeholder "evidence-validation:$GITHUB_SHA"
          trap 'docker logs ev-smoke; docker rm -f ev-smoke >/dev/null' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-all-errors --max-time 3 --retry-delay 2 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/ | grep -q 'Evidence Validation'
          curl --fail http://127.0.0.1:8080/how-it-works | grep -q 'Evidence Validation'
          curl --fail http://127.0.0.1:8080/workflow.js | grep -q 'From a claim to a review and a ledger record'
      - name: Save checked image
        if: github.ref == 'refs/heads/main'
        run: docker save "evidence-validation:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/evidence-validation-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main'
        with:
          name: evidence-validation-image-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-validation-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.security_reviewed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evidence-validation-image-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-validation-image
      - name: Load checked image
        run: docker load --input "$RUNNER_TEMP/evidence-validation-image/evidence-validation-image.tar.gz"
      - name: Check deployment variables
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          RUNTIME_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ADMIN_VERSION: ${{ vars.SUPABASE_ADMIN_SECRET_VERSION }}
        run: |
          for variable in PROJECT REGION REPOSITORY RUNTIME_ACCOUNT APP_ORIGIN SUPABASE_URL SUPABASE_ANON_KEY ADMIN_VERSION; do
            test -n "${!variable}" || { echo "Missing repository variable: $variable"; exit 1; }
          done
          [[ "$APP_ORIGIN" == https://* && "$SUPABASE_URL" == https://* && "$ADMIN_VERSION" =~ ^[0-9]+$ ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push checked image
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker tag "evidence-validation:$GITHUB_SHA" "$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/evidence-validation:$GITHUB_SHA"
          docker push "$REGION-docker.pkg.dev/$PROJECT/$REPOSITORY/evidence-validation:$GITHUB_SHA"
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: evidence-validation
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/evidence-validation:${{ github.sha }}
          flags: '--no-invoker-iam-check --ingress=internal-and-cloud-load-balancing --timeout=60 --concurrency=8 --max-instances=1 --memory=512Mi --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}'
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          env_vars: |
            APP_ORIGIN=${{ vars.APP_ORIGIN }}
            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
            PLATFORM_FEE_BPS=1000
            TRUST_PROXY_HOPS=1
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY=astra-supabase-service-role:${{ vars.SUPABASE_ADMIN_SECRET_VERSION }}
